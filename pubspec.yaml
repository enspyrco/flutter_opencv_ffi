name: flutter_opencv_ffi
description: >-
  Dart FFI bindings to OpenCV for image processing —
  load/save, color conversion, blur, edge detection, resize.
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  ffi: ^2.1.4
  logging: ^1.3.0
  hooks: ^1.0.0
  code_assets: ^1.0.0
  native_toolchain_c: ^0.17.0

dev_dependencies:
  ffigen: ^18.1.0
  lints: ^5.1.1
  test: ^1.25.15
